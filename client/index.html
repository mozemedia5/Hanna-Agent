<!--
  Hanna / Quiet Command Center
  Typography is intentionally distinct from generic AI defaults: Manrope for interface
  hierarchy and IBM Plex Mono for metadata, shortcuts, and artifact labels.
-->
<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#eef0ed" />
    <meta name="description" content="Hanna is a quiet AI workspace for the questions worth asking and the work worth shaping." />
    <title>Hanna — Make room for better thinking</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/hanna-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/hanna-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/hanna-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/hanna-icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint && websiteId && !endpoint.startsWith("%")) {
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", websiteId);
          document.head.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
